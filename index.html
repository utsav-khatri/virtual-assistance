<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Assistant</title>
    <link rel="shortcut icon" href="jarvis4.gif">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main">
        <div class="images" id="image">
            <img src="echo.gif" alt="">
        </div>
        <div class="names" id="name">
            <p>J A R V I S</p>
        </div>
        <div class="wellcome-messages" id="wellcome-message">
            <p>Hey I am JARVIS , How May I Help You ?</p>
        </div>
        <div class="speak">
            <button class="init-btn" id="initBtn"><i class="fa-solid fa-power-off"></i><h1>Initialize JARVIS</h1></button>
            <button class="speach" id="speachBtn" style="display:none;"><i class="fa-solid fa-microphone-lines"></i><h1 class="content">click hear to speak</h1></button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
